<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Neo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #auth-screen { background: #1e293b; padding: 35px 25px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center; border-top: 6px solid #00a884; }
        #auth-screen h2 { color: #fff; margin-bottom: 20px; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #app-screen { display: none; width: 100vw; height: 100vh; background: #0f172a; flex-direction: row; position: relative; overflow: hidden; }
        .sidebar { width: 30%; min-width: 280px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { background: #334155; height: 60px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; color: #fff; }
        .logout-btn { background: #f43f5e; color: white; border: none; padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .search-container { padding: 10px; display: flex; gap: 6px; }
        .search-input { flex: 1; padding: 8px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; outline: none; }
        .add-friend-btn { background: #00a884; color: white; border: none; padding: 0 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .friends-list { flex: 1; overflow-y: auto; padding: 5px; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 10px; margin-bottom: 4px; cursor: pointer; color: #fff; }
        .friend-item.active { background: rgba(0, 168, 132, 0.2); border: 1px solid #00a884; }
        .delete-friend-btn { background: transparent; border: none; color: #64748b; font-size: 18px; cursor: pointer; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .chat-header { background: #1e293b; height: 60px; display: flex; align-items: center; padding: 0 15px; color: #fff; border-bottom: 1px solid #334155; }
        .avatar { width: 36px; height: 36px; background: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 10px; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .chat-placeholder { margin: auto; color: #64748b; font-size: 14px; text-align: center; }
        .message-row { display: flex; width: 100%; }
        .message-row.my-msg { justify-content: flex-end; }
        .message-row.other-msg { justify-content: flex-start; }
        .bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; color: #fff; position: relative; font-size: 15px; }
        .my-msg .bubble { background: #00a884; }
        .other-msg .bubble { background: #334155; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 4px; text-align: right; }
        .video-round { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 2px solid #00a884; background: black; }
        .audio-player { height: 32px; max-width: 200px; margin-top: 4px; }
        .input-container { background: #1e293b; height: 65px; display: flex; align-items: center; padding: 0 15px; gap: 8px; }
        #text-input { flex: 1; height: 40px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 0 12px; color: #fff; outline: none; }
        .media-btn { background: #334155; border: none; color: #00ca9e; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        .media-btn.recording { background: #f43f5e; color: white; }
        #send-btn { background: #00a884; border: none; color: white; padding: 10px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        @media (max-width: 767px) {
            .sidebar { width: 100vw; min-width: 100vw; position: absolute; left: 0; top: 0; height: 100%; z-index: 5; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100vw; }
            .back-btn { display: block !important; color: #00a884; background: transparent; border: none; font-size: 24px; margin-right: 10px; cursor: pointer; }
        }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div id="auth-screen">
        <h2>Вход в Мессенджер</h2>
        <input type="text" id="auth-user" class="auth-input" placeholder="Введите ваш никнейм">
        <button onclick="handleLocalAuth()" class="auth-btn">Войти в систему</button>
    </div>

    <!-- Основной рабочий экран чата -->
    <div id="app-screen">
        <video id="video-preview" autoplay muted playsinline style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #f43f5e; z-index: 100; background: black;"></video>

        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-user">
                    <span id="my-name">Профиль</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <div class="search-container">
                <input type="text" id="new-friend-name" class="search-input" placeholder="Ник друга...">
                <button class="add-friend-btn" onclick="addFriend()">+</button>
            </div>
            <div class="friends-list" id="friends-box"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <button class="back-btn" style="display:none; outline:none;" onclick="closeChatMobile()">&larr;</button>
                <div class="avatar" id="partner-avatar">?</div>
                <div>
                    <h4 id="partner-display-name">Чат не выбран</h4>
                </div>
            </div>
            <div id="messages">
                <div class="chat-placeholder">Выберите друга из списка контактов слева, чтобы начать диалог.</div>
            </div>
            <div class="input-container">
                <button id="voice-btn" class="media-btn" onclick="toggleVoiceRecord()" disabled>🎙️</button>
                <button id="video-btn" class="media-btn" onclick="toggleVideoRecord()" disabled>🎥</button>
                <input type="text" id="text-input" placeholder="Выберите друга..." disabled>
                <button id="send-btn" onclick="sendMessage()">УЛЕТЕЛО</button>
            </div>
        </div>
    </div>
<script>
    let currentUser = localStorage.getItem('chat_username') || null;
    let currentPartner = null;
    let currentRoomId = null;
    let friendsList = [];
    let updateInterval = null;
    let lastMessagesCount = 0;
    
    let audioRecorder = null, videoRecorder = null;
    let audioChunks = [], videoChunks = [];
    let videoStreamRef = null;

    const messagesDiv = document.getElementById('messages');
    if (currentUser) { showChat(); }

    document.getElementById('text-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });

    // Железный локальный вход без бэкенд-ошибок
    function handleLocalAuth() {
        const username = document.getElementById('auth-user').value.trim();
        if (!username) { alert("Введите ник!"); return; }
        currentUser = username;
        localStorage.setItem('chat_username', username);
        showChat();
    }

    function showChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('my-name').textContent = currentUser;
        if (!updateInterval) { updateInterval = setInterval(fetchMessages, 1500); }
        loadFriends();
    }

    function loadFriends() {
        fetch(`/api/friends/get?user=${currentUser}`).then(res => res.json()).then(data => { friendsList = data; renderFriends(); });
    }

    function saveFriendsOnServer() {
        fetch('/api/friends/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: currentUser, friends: friendsList })
        }).then(() => renderFriends());
    }

    function addFriend() {
        const input = document.getElementById('new-friend-name');
        const name = input.value.trim();
        if (!name || name.toLowerCase() === currentUser.toLowerCase() || friendsList.includes(name)) return;
        friendsList.push(name);
        input.value = '';
        saveFriendsOnServer();
    }

    function deleteFriend(name, event) {
        event.stopPropagation();
        friendsList = friendsList.filter(f => f !== name);
        if (currentPartner === name) {
            currentPartner = null; currentRoomId = null;
            document.getElementById('text-input').setAttribute('disabled', 'true');
        }
        saveFriendsOnServer();
    }

    function selectChat(partner) {
        currentPartner = partner;
        document.getElementById('partner-display-name').textContent = currentPartner;
        document.getElementById('partner-avatar').textContent = currentPartner.substring(0,2);
        const sorted = [currentUser.toLowerCase(), currentPartner.toLowerCase()].sort();
        currentRoomId = `${sorted}_${sorted}`;
        lastMessagesCount = 0;
        document.getElementById('text-input').removeAttribute('disabled');
        document.getElementById('voice-btn').removeAttribute('disabled');
        document.getElementById('video-btn').removeAttribute('disabled');
        if (window.innerWidth < 768) { document.getElementById('app-sidebar').classList.add('hidden'); }
        fetchMessages();
        renderFriends();
    }

    function closeChatMobile() { document.getElementById('app-sidebar').classList.remove('hidden'); }

    function renderFriends() {
        const box = document.getElementById('friends-box'); box.innerHTML = '';
        friendsList.forEach(friend => {
            const isActive = currentPartner === friend;
            const item = document.createElement('div');
            item.className = `friend-item ${isActive ? 'active' : ''}`;
            item.onclick = () => selectChat(friend);
            item.innerHTML = `<span>${friend}</span><button class="delete-friend-btn" onclick="deleteFriend('${friend}', event)">&times;</button>`;
            box.appendChild(item);
        });
    }

    function logout() {
        clearInterval(updateInterval); updateInterval = null;
        localStorage.removeItem('chat_username');
        location.reload();
    }

    function toggleVoiceRecord() {
        const btn = document.getElementById('voice-btn');
        if (audioRecorder && audioRecorder.state === "recording") {
            audioRecorder.stop(); btn.classList.remove('recording');
        } else {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                audioChunks = []; audioRecorder = new MediaRecorder(stream);
                audioRecorder.ondataavailable = e => audioChunks.push(e.data);
                audioRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' }));
                    reader.onloadend = () => sendMedia(reader.result, 'audio');
                    stream.getTracks().forEach(t => track.stop());
                };
                audioRecorder.start(); btn.classList.add('recording');
            });
        }
    }

    function toggleVideoRecord() {
        const btn = document.getElementById('video-btn');
        const preview = document.getElementById('video-preview');
        if (videoRecorder && videoRecorder.state === "recording") {
            videoRecorder.stop(); btn.classList.remove('recording'); preview.style.display = 'none';
            if (preview.srcObject) { preview.srcObject.getTracks().forEach(t => t.stop()); }
        } else {
            navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 320, height: 320, facingMode: "user" } }).then(stream => {
                videoChunks = []; videoStreamRef = stream; preview.srcObject = stream; preview.style.display = 'block';
                let options = { mimeType: 'video/webm; codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };
                videoRecorder = new MediaRecorder(stream, options);
                videoRecorder.ondataavailable = e => videoChunks.push(e.data);
                videoRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(videoChunks, { type: videoRecorder.mimeType }));
                    reader.onloadend = () => sendMedia(reader.result, 'video');
                    videoStreamRef.getTracks().forEach(t => t.stop());
                };
                videoRecorder.start(10); btn.classList.add('recording');
            });
        }
    }

    function sendMedia(base64Data, mediaType) {
        fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, room: currentRoomId, text: base64Data, type: mediaType })
        }).then(() => fetchMessages());
    }

    function sendMessage() {
        const textInput = document.getElementById('text-input'); const text = textInput.value.trim();
        if (!text) return;
        fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, room: currentRoomId, text: text, type: 'text' })
        }).then(() => { textInput.value = ''; fetchMessages(); });
    }

    function fetchMessages() {
        if (!currentUser || !currentRoomId) return;
        fetch(`/api/messages?room=${currentRoomId}`).then(res => res.json()).then(data => {
            if (data.length === lastMessagesCount) return;
            lastMessagesCount = data.length;
            messagesDiv.innerHTML = '';
            data.forEach(msg => {
                const row = document.createElement('div');
                row.className = `message-row ${msg.sender === currentUser ? 'my-msg' : 'other-msg'}`;
                let html = '';
                if (msg.type === 'audio') html = `<audio class="audio-player" src="${msg.text}" controls></audio>`;
                else if (msg.type === 'video') html = `<video class="video-round" src="${msg.text}" controls playsinline autoplay loop></video>`;
                else html = `<div>${msg.text}</div>`;
                row.innerHTML = `<div class="bubble">${html}<div class="msg-time">${msg.time}</div></div>`;
                messagesDiv.appendChild(row);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }).catch(() => {});
    }
</script>
</body>
</html>
