<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Goosebumps Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%); display: flex; justify-content: center; align-items: center; }
        
        #auth-screen { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 30px 20px; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); border-top: 6px solid #00a884; z-index: 10; }
        #auth-screen h2 { color: #f8fafc; margin-bottom: 24px; font-weight: 600; font-size: 24px; }
        .auth-input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; outline: none; background: rgba(15, 23, 42, 0.8); color: #f8fafc; font-size: 16px; }
        .auth-btn { width: 100%; padding: 14px; background: #00a884; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        #auth-error { color: #f43f5e; font-size: 14px; margin-bottom: 12px; display: none; }
        
        #app-screen { display: none; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); position: relative; flex-direction: row; overflow: hidden; }
        .sidebar { width: 32%; min-width: 300px; height: 100%; background: #0f172a; border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; z-index: 5; transition: transform 0.25s ease-in-out; }
        .sidebar-header { background: rgba(30, 41, 59, 0.5); height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-user { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; color: #f8fafc; min-width: 0; flex: 1; }
        .sidebar-user span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .search-container { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; background: rgba(15, 23, 42, 0.2); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .search-row { display: flex; gap: 8px; width: 100%; }
        .search-input { flex: 1; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; background: rgba(15, 23, 42, 0.6); color: #f8fafc; font-size: 15px; outline: none; min-width: 0; }
        .add-friend-btn { background: rgba(0, 168, 132, 0.2); color: #00ca9e; border: 1px solid rgba(0, 168, 132, 0.3); padding: 0 14px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .create-group-btn { width: 100%; padding: 8px; background: rgba(2, 132, 199, 0.2); color: #38bdf8; border: 1px solid rgba(2, 132, 199, 0.3); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }

        .requests-section { border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(244, 180, 26, 0.03); max-height: 150px; overflow-y: auto; }
        .request-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(30, 41, 59, 0.3); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .request-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .request-name { font-size: 14px; color: #f8fafc; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .request-label { font-size: 11px; color: #fbbf24; margin-top: 1px; }
        .request-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .req-btn { border: none; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .req-accept { background: #00a884; color: white; }
        .req-decline { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }

        .friends-list { flex: 1; overflow-y: auto; padding: 8px; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; }
        .friend-item.active { background: rgba(0, 168, 132, 0.15); border: 1px solid rgba(0, 168, 132, 0.2); }
        .friend-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .friend-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; margin-right: 8px; }
        .friend-name { font-size: 15px; color: #e2e8f0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .friend-last-msg { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .friend-item.active .friend-last-msg { color: #00ca9e; }
        .friend-status-box { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; flex-shrink: 0; }
        .friend-time-label { font-size: 11px; color: #64748b; }
        .friend-item.active .friend-time-label { color: #00ca9e; }
        .unread-badge { background: #00a884; color: white; font-size: 11px; font-weight: bold; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .delete-friend-btn { background: transparent; border: none; color: #64748b; font-size: 20px; cursor: pointer; padding: 0 4px; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.2); height: 100%; overflow: hidden; position: relative; }
        .chat-header { background: rgba(30, 41, 59, 0.4); height: 60px; min-height: 60px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .back-btn { display: none; color: #00a884; background: transparent; border: none; font-size: 24px; margin-right: 12px; cursor: pointer; padding: 4px; }
        .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, #00a884, #0284c7); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: white; font-weight: 600; text-transform: uppercase; flex-shrink: 0; font-size: 14px; }
        .user-info { min-width: 0; margin-left: 12px; }
        .partner-title { color: #f8fafc; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .partner-status { color: #00ca9e; font-size: 12px; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(10, 15, 30, 0.3); }
        .chat-placeholder { margin: auto; background: rgba(30, 41, 59, 0.8); padding: 16px 24px; border-radius: 16px; color: #94a3b8; font-size: 14px; text-align: center; max-width: 85%; border: 1px solid rgba(255,255,255,0.05); }
        .message-row { display: flex; width: 100%; position: relative; margin-bottom: 4px; align-items: center; transition: transform 0.2s ease; }
        .message-row.my-msg { justify-content: flex-end; }
        .message-row.other-msg { justify-content: flex-start; }
        /* ИСПРАВЛЕНИЕ: Равномерное и стабильное разбиение текста */
        .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; color: #f1f5f9; position: relative; word-wrap: break-word; overflow-wrap: break-word; word-break: normal; white-space: pre-wrap; display: inline-block; min-width: 80px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .my-msg .bubble { background: linear-gradient(135deg, #008f72 0%, #00a884 100%); border-bottom-right-radius: 4px; }
        .other-msg .bubble { background: #1e293b; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        
        .msg-author { font-size: 12px; font-weight: 600; color: #38bdf8; padding-bottom: 3px; }
        .my-msg .msg-author { color: #a7f3d0; }

        /* ИСПРАВЛЕНИЕ: Стили для отображения цитирования сверху сообщения */
        .msg-reply-block { background: rgba(0, 0, 0, 0.2); border-left: 3px solid #00ca9e; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 13px; cursor: pointer; display: block; max-width: 100%; }
        .msg-reply-author { font-weight: 600; color: #00ca9e; font-size: 11px; margin-bottom: 1px; display: block; }
        .msg-reply-text { color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .my-msg .msg-reply-block { border-left-color: #a7f3d0; }
        .my-msg .msg-reply-author { color: #a7f3d0; }

        /* ИСПРАВЛЕНИЕ: Крестик удаления на самом сообщении */
        .bubble-delete-x { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; background: #f43f5e; color: white; border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); z-index: 10; }
        .bubble:hover .bubble-delete-x { display: flex; }
        .video-round { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 4px solid #00a884; box-shadow: 0 6px 20px rgba(0,0,0,0.4); background: black; display: block; cursor: pointer; transition: transform 0.2s ease; }
        .video-round:active { transform: scale(0.98); }
        .audio-player { outline: none; height: 40px; max-width: 220px; display: block; margin-top: 2px; }

        .chat-image { max-width: 280px; max-height: 280px; border-radius: 12px; display: block; margin-top: 4px; border: 1px solid rgba(255,255,255,0.1); object-fit: cover; }
        .chat-file-card { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 12px; margin-top: 4px; text-decoration: none; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.05); }
        .chat-file-icon { font-size: 24px; }
        .chat-file-info { display: flex; flex-direction: column; min-width: 0; }
        .chat-file-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #00ca9e; }
        .chat-file-action { font-size: 11px; color: #94a3b8; margin-top: 1px; }

        /* ИСПРАВЛЕНИЕ: Плашка превью цитирования над полем ввода */
        .reply-preview-bar { background: #1f2937; border-left: 4px solid #00a884; padding: 6px 12px; display: none; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
        .reply-preview-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .reply-preview-user { font-weight: 600; color: #00ca9e; font-size: 12px; }
        .reply-preview-txt { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-preview-close { background: transparent; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 0 4px; }

        .msg-text { color: #f8fafc !important; font-size: 15px; line-height: 1.4; display: block; padding: 2px 0; }
        .msg-time { font-size: 11px; color: rgba(255, 255, 255, 0.4); text-align: right; margin-top: 4px; width: 100%; }

        @media (max-width: 767px) {
            #app-screen { width: 100%; height: 100%; border-radius: 0; }
            .sidebar { width: 100%; min-width: 100%; position: absolute; left: 0; top: 0; height: 100%; background: #0f172a; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; min-width: 100%; position: absolute; left: 0; top: 0; z-index: 4; }
            .back-btn { display: block; }
            .bubble { max-width: 85%; }
            .video-round { width: 260px; height: 260px; }
            .audio-player { max-width: 190px; }
        }
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2>Вход в #DarknetZone#</h2>
        <div id="auth-error"></div>
        <input type="text" id="auth-user" class="auth-input" placeholder="Имя пользователя">
        <input type="password" id="auth-pass" class="auth-input" placeholder="Пароль">
        <button onclick="handleAuth()" class="auth-btn">Войти / Создать аккаунт</button>
    </div>

    <div id="app-screen">
        <video id="video-preview" autoplay muted playsinline style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.6); z-index: 100; background: black;"></video>
        
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-user"><div class="avatar" id="my-avatar">?</div><span id="my-name">Профиль</span></div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            
            <div class="search-container">
                <div class="search-row">
                    <input type="text" id="new-friend-name" class="search-input" placeholder="Имя пользователя...">
                    <button class="add-friend-btn" onclick="sendFriendRequest()">+</button>
                </div>
                <button class="create-group-btn" onclick="openCreateGroupModal()">👥 Создать конференцию</button>
            </div>

            <div class="requests-section" id="requests-box"></div>
            <div class="friends-list" id="friends-box"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChatMobile()">&larr;</button>
                <div class="avatar" id="partner-avatar">?</div>
                <div class="user-info">
                    <h4 class="partner-title" id="partner-display-name">Чат не выбран</h4>
                    <p class="partner-status" id="chat-status" style="display:none;">в сети</p>
                </div>
            </div>
            <div id="messages"><div class="chat-placeholder" id="placeholder-text">Выберите друга или группу из списка, чтобы начать переписку.</div></div>

            <!-- ИСПРАВЛЕНИЕ: Панель отображения цитаты перед отправкой -->
            <div class="reply-preview-bar" id="reply-preview-container">
                <div class="reply-preview-info">
                    <span class="reply-preview-user" id="reply-preview-username">Ответ пользователю</span>
                    <span class="reply-preview-txt" id="reply-preview-text">Текст</span>
                </div>
                <button class="reply-preview-close" onclick="cancelReply()">&times;</button>
            </div>

            <div class="input-container">
                <div class="tools-row">
                    <button id="voice-btn" class="media-btn" onclick="toggleVoiceRecord()">🎙️</button>
                    <button id="video-btn" class="media-btn" onclick="toggleVideoRecord()">🎥</button>
                    <button id="file-btn" class="media-btn" onclick="document.getElementById('hidden-file-input').click()">📎</button>
                    <input type="file" id="hidden-file-input" style="display:none;" onchange="uploadAnyFile(this)">
                </div>
                <div class="input-row">
                    <input type="text" id="text-input" placeholder="Сообщение..." disabled>
                    <button id="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="forward-modal" class="modal-overlay" onclick="closeForwardModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3>Переслать сообщение <button class="modal-close" onclick="closeForwardModal()">&times;</button></h3>
            <div id="modal-contacts-list" class="modal-list"></div>
        </div>
    </div>

    <div id="group-modal" class="modal-overlay" onclick="closeGroupModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3>Создать группу <button class="modal-close" onclick="closeGroupModal()">&times;</button></h3>
            <input type="text" id="group-name-input" class="auth-input" placeholder="Название конференции" style="margin-top:10px;">
            <p style="font-size:12px; color:#64748b; margin-bottom:8px;">Введите имена участников через запятую:</p>
            <input type="text" id="group-members-input" class="auth-input" placeholder="друг1, друг2, друг3">
            <button onclick="submitCreateGroup()" class="auth-btn" style="background:#0284c7;">Создать</button>
        </div>
    </div>
<script>
    let currentUser = localStorage.getItem('chat_username') || null;
    let currentPartner = null;
    let currentRoomId = null;
    let isCurrentGroup = false; 
    let friendsList = [];
    let friendRequests = [];
    let updateInterval = null;
    let lastMessagesCount = 0;
    
    let audioRecorder = null;
    let videoRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let videoStreamRef = null;

    // ИСПРАВЛЕНИЕ: Переменные для цитирования и жестов
    let activeReplyData = null;
    let touchStartX = 0;
    let touchStartY = 0;

    const messagesDiv = document.getElementById('messages');

    if (currentUser) { showChat(); }

    document.getElementById('text-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('new-friend-name').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendFriendRequest(); });

    function handleAuth() {
        const username = document.getElementById('auth-user').value.trim();
        const password = document.getElementById('auth-pass').value.trim();
        const errorDiv = document.getElementById('auth-error');
        if (!username || !password) { errorDiv.textContent = "Заполните все поля!"; errorDiv.style.display = "block"; return; }
        fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) { currentUser = username; localStorage.setItem('chat_username', username); showChat(); }
            else { errorDiv.textContent = data.message; errorDiv.style.display = "block"; }
        })
        .catch(() => { errorDiv.textContent = "Ошибка сервера"; errorDiv.style.display = "block"; });
    }
    function showChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('my-name').textContent = currentUser;
        document.getElementById('my-avatar').textContent = currentUser.substring(0,2);
        if (!updateInterval) { 
            updateInterval = setInterval(() => {
                fetchMessages();
                loadFriendsAndRequests();
            }, 1500); 
        }
        loadFriendsAndRequests();
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }

    function loadFriendsAndRequests() {
        if (!currentUser) return;
        fetch(`/api/friends/get?user=${currentUser}`)
            .then(res => res.json())
            .then(data => { friendsList = data; renderFriends(); });

        fetch(`/api/friends/requests?user=${currentUser}`)
            .then(res => res.json())
            .then(data => { friendRequests = data; renderRequests(); });
    }

    function sendFriendRequest() {
        const input = document.getElementById('new-friend-name');
        const targetName = input.value.trim();
        if (!targetName) return;
        if (targetName.toLowerCase() === currentUser.toLowerCase()) { alert("Нельзя отправить запрос самому себе!"); return; }
        const isAlreadyFriend = friendsList.some(f => !f.isGroup && f.name.toLowerCase() === targetName.toLowerCase());
        if (isAlreadyFriend) { alert("Этот пользователь уже в списке друзей!"); return; }

        fetch('/api/friends/request/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: currentUser, to: targetName })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) { alert(`Запрос отправлен пользователю ${targetName}`); input.value = ''; }
            else { alert(data.message || "Ошибка отправки запроса"); }
        })
        .catch(() => alert("Пользователь не найден"));
    }

    function handleRequest(fromUser, action) {
        fetch('/api/friends/request/respond', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: currentUser, from: fromUser, action: action })
        })
        .then(res => { if (res.ok) { loadFriendsAndRequests(); } })
        .catch(err => console.error(err));
    }
    function renderRequests() {
        const box = document.getElementById('requests-box'); box.innerHTML = '';
        if (friendRequests.length === 0) { box.style.display = 'none'; return; }
        box.style.display = 'block';
        friendRequests.forEach(req => {
            const item = document.createElement('div'); item.className = 'request-item';
            item.innerHTML = `<div class="request-info"><span class="request-name">${req}</span><span class="request-label">Хочет добавиться в друзья</span></div><div class="request-actions"><button class="req-btn req-accept" onclick="handleRequest('${req}', 'accept')">Принять</button><button class="req-btn req-decline" onclick="handleRequest('${req}', 'decline')">Отклонить</button></div>`;
            box.appendChild(item);
        });
    }

    function renderFriends() {
        const box = document.getElementById('friends-box'); box.innerHTML = '';
        if (friendsList.length === 0) { box.innerHTML = `<div style="padding:20px; text-align:center; color:#64748b; font-size:13px;">Список контактов пуст</div>`; return; }
        friendsList.forEach(friend => {
            let activeId = friend.isGroup ? friend.id : `${[currentUser.toLowerCase(), friend.name.toLowerCase()].sort()}_${[currentUser.toLowerCase(), friend.name.toLowerCase()].sort()}`;
            const isActive = currentRoomId && currentRoomId === activeId;
            const item = document.createElement('div'); item.className = `friend-item ${isActive ? 'active' : ''}`;
            item.onclick = () => selectChat(friend);
            const badgeHTML = (friend.unread > 0 && !isActive) ? `<div class="unread-badge">${friend.unread}</div>` : '';
            const timeHTML = friend.time ? `<div class="friend-time-label">${friend.time}</div>` : '';
            const displayName = friend.isGroup ? `👥 ${friend.name}` : friend.name;
            const friendDataEscaped = JSON.stringify(friend).replace(/"/g, '&quot;');
            const delBtnHTML = `<button class="delete-friend-btn" onclick="deleteFriend(${friendDataEscaped}, event)">&times;</button>`;
            item.innerHTML = `<div class="friend-info"><div class="avatar" style="width:36px; height:36px; font-size:13px; background:rgba(255,255,255,0.05); color:#00ca9e; border:1px solid rgba(255,255,255,0.05); border-radius:10px;">${friend.name.substring(0,2)}</div><div class="friend-meta"><div class="friend-name">${displayName}</div><div class="friend-last-msg">${friend.lastMessage}</div></div><div class="friend-status-box">${timeHTML}${badgeHTML}</div></div>${delBtnHTML}`;
            box.appendChild(item);
        });
    }

    function openCreateGroupModal() { document.getElementById('group-modal').style.display = 'flex'; }
    function closeGroupModal() { document.getElementById('group-modal').style.display = 'none'; }

    function submitCreateGroup() {
        const nameInput = document.getElementById('group-name-input'); const membersInput = document.getElementById('group-members-input');
        const gName = nameInput.value.trim(); const gMembersRaw = membersInput.value.trim();
        if (!gName || !gMembersRaw) { alert("Заполните поля!"); return; }
        const memberArray = gMembersRaw.split(',').map(m => m.trim()).filter(m => m !== '');
        fetch('/api/groups/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ creator: currentUser, groupName: gName, members: memberArray })
        }).then(res => res.json()).then(data => { if (data.success) { nameInput.value = ''; membersInput.value = ''; closeGroupModal(); loadFriendsAndRequests(); } });
    }
    function deleteFriend(friendObj, event) {
        if (event) event.stopPropagation();
        if (friendObj.isGroup) {
            if (!confirm(`Удалить групповую конференцию "${friendObj.name}" для всех участников?`)) return;
            fetch('/api/groups/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ groupId: friendObj.id }) }).then(() => { if (isCurrentGroup && currentRoomId === friendObj.id) resetChatArea(); loadFriendsAndRequests(); });
            return;
        }
        if (!confirm(`Удалить ${friendObj.name} из контактов?`)) return;
        const cleanNames = friendsList.filter(f => !f.isGroup && f.name.toLowerCase() !== friendObj.name.toLowerCase()).map(f => f.name);
        if (!isCurrentGroup && currentPartner && currentPartner.toLowerCase() === friendObj.name.toLowerCase()) resetChatArea();
        fetch('/api/friends/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: currentUser, friends: cleanNames }) }).then(() => loadFriendsAndRequests());
    }

    function resetChatArea() {
        currentPartner = null; currentRoomId = null; isCurrentGroup = false; cancelReply();
        document.getElementById('partner-display-name').textContent = "Чат не выбран"; document.getElementById('chat-status').style.display = "none";
        document.getElementById('text-input').setAttribute('disabled', 'true'); document.getElementById('text-input').placeholder = "Сообщение...";
        messagesDiv.innerHTML = `<div class="chat-placeholder">Выберите друга или группу из списка контактов слева.</div>`;
    }

    function selectChat(itemObj) {
        if (itemObj.isGroup) { currentPartner = itemObj.name; currentRoomId = itemObj.id; isCurrentGroup = true; document.getElementById('chat-status').textContent = "конференция"; } 
        else { currentPartner = itemObj.name; isCurrentGroup = false; const sorted = [currentUser.toLowerCase(), currentPartner.toLowerCase()].sort(); currentRoomId = `${sorted}_${sorted}`; document.getElementById('chat-status').textContent = "в сети"; }
        document.getElementById('partner-display-name').textContent = currentPartner; document.getElementById('partner-avatar').textContent = currentPartner.substring(0,2);
        document.getElementById('chat-status').style.display = "block"; lastMessagesCount = 0; cancelReply();
        document.getElementById('text-input').removeAttribute('disabled'); document.getElementById('text-input').placeholder = "Написать сообщение...";
        if (window.innerWidth < 768) { document.getElementById('app-sidebar').classList.add('hidden'); }
        messagesDiv.innerHTML = ''; markChatAsRead(currentRoomId); fetchMessages(); renderFriends();
    }

    function closeChatMobile() { document.getElementById('app-sidebar').classList.remove('hidden'); }
    function markChatAsRead(roomId) { if (!currentUser || !roomId) return; fetch('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: currentUser, room: roomId }) }).then(() => loadFriendsAndRequests()); }
    function logout() { clearInterval(updateInterval); updateInterval = null; localStorage.removeItem('chat_username'); currentUser = null; currentPartner = null; currentRoomId = null; isCurrentGroup = false; friendsList = []; friendRequests = []; document.getElementById('app-screen').style.display = 'none'; document.getElementById('auth-screen').style.display = 'block'; document.getElementById('text-input').setAttribute('disabled', 'true'); cancelReply(); }

    // ИСПРАВЛЕНИЕ: Инициализация свайпа для элементов сообщений
    function setupSwipe(rowElement, msgObj) {
        rowElement.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; rowElement.style.transition = 'none'; }, {passive: true});
        rowElement.addEventListener('touchmove', e => {
            let diffX = e.touches[0].clientX - touchStartX;
            let diffY = e.touches[0].clientY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 60) diffX = 60; if (diffX < -60) diffX = -60;
                rowElement.style.transform = `translateX(${diffX}px)`;
            }
        }, {passive: true});
        rowElement.addEventListener('touchend', e => {
            let diffX = e.changedTouches[0].clientX - touchStartX;
            rowElement.style.transition = 'transform 0.2s ease'; rowElement.style.transform = 'translateX(0px)';
            if (diffX > 45) { initiateReply(msgObj); } 
            else if (diffX < -45) { initiateForward(msgObj); }
        });
    }

    function initiateReply(msg) {
        let textSummary = msg.type === 'text' ? msg.text : `[Медиа: ${msg.type}]`;
        if (msg.type === 'file') { try { textSummary = JSON.parse(msg.text).name; } catch(e){} }
        activeReplyData = { id: msg.id, sender: msg.sender, text: textSummary };
        document.getElementById('reply-preview-username').textContent = `Ответ пользователю ${msg.sender}`;
        document.getElementById('reply-preview-text').textContent = textSummary;
        document.getElementById('reply-preview-container').style.display = 'flex';
        document.getElementById('text-input').focus();
    }
    function cancelReply() { activeReplyData = null; document.getElementById('reply-preview-container').style.display = 'none'; }
    function initiateForward(msg) {
        let cleanText = msg.text;
        activeMessageId = msg.id; activeMessageText = cleanText; activeMessageType = msg.type; activeMessageOriginalSender = msg.sender;
        const modal = document.getElementById('forward-modal'); const listContainer = document.getElementById('modal-contacts-list');
        listContainer.innerHTML = '';
        if (friendsList.length === 0) { listContainer.innerHTML = '<div style="color:#64748b;font-size:14px;text-align:center;">Нет контактов</div>'; } 
        else {
            friendsList.forEach(f => {
                const item = document.createElement('div'); item.className = 'modal-item';
                item.innerHTML = `<span>${f.isGroup ? '👥 ' + f.name : f.name}</span><span class="modal-forward-icon">➔</span>`;
                item.onclick = () => {
                    let targetRoomId = f.isGroup ? f.id : `${[currentUser.toLowerCase(), f.name.toLowerCase()].sort()}_${[currentUser.toLowerCase(), f.name.toLowerCase()].sort()}`;
                    let originalAuthor = activeMessageOriginalSender || currentUser;
                    const formData = new FormData(); formData.append('sender', currentUser); formData.append('room', targetRoomId);
                    formData.append('text', activeMessageText); formData.append('type', activeMessageType); formData.append('forwardedFrom', originalAuthor);
                    fetch('/api/send', { method: 'POST', body: formData }).then(() => { document.getElementById('forward-modal').style.display = 'none'; alert('Переслано'); loadFriendsAndRequests(); });
                };
                listContainer.appendChild(item);
            });
        }
        modal.style.display = 'flex';
    }
    function closeForwardModal() { document.getElementById('forward-modal').style.display = 'none'; }

    function deleteSpecificMessage(msgId) {
        if (!confirm("Удалить это сообщение для всех?")) return;
        fetch('/api/messages/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room: currentRoomId, messageId: msgId }) }).then(() => fetchMessages());
    }

    function toggleVoiceRecord() {
        const btn = document.getElementById('voice-btn');
        if (audioRecorder && audioRecorder.state === "recording") { audioRecorder.stop(); btn.classList.remove('recording'); btn.textContent = "🎙️"; } 
        else {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                audioChunks = []; audioRecorder = new MediaRecorder(stream);
                audioRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
                audioRecorder.onstop = () => {
                    const formData = new FormData(); formData.append('sender', currentUser); formData.append('room', currentRoomId);
                    formData.append('type', 'audio'); formData.append('media', new Blob(audioChunks, { type: 'audio/webm' }), 'voice.webm');
                    if (activeReplyData) { formData.append('replyTo', JSON.stringify(activeReplyData)); cancelReply(); }
                    fetch('/api/send', { method: 'POST', body: formData }).then(() => fetchMessages()); stream.getTracks().forEach(t => t.stop());
                };
                audioRecorder.start(); btn.classList.add('recording'); btn.textContent = "🛑";
            }).catch(() => alert("Нет доступа!"));
        }
    }
    function toggleVideoRecord() {
        const btn = document.getElementById('video-btn'); const preview = document.getElementById('video-preview');
        if (videoRecorder && videoRecorder.state === "recording") { videoRecorder.stop(); btn.classList.remove('recording'); btn.textContent = "🎥"; preview.style.display = 'none'; } 
        else {
            navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 320, height: 320, facingMode: "user" } }).then(stream => {
                videoChunks = []; videoStreamRef = stream; preview.srcObject = stream; preview.style.display = 'block';
                videoRecorder = new MediaRecorder(stream);
                videoRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) videoChunks.push(e.data); };
                videoRecorder.onstop = () => {
                    const formData = new FormData(); formData.append('sender', currentUser); formData.append('room', currentRoomId);
                    formData.append('type', 'video'); formData.append('media', new Blob(videoChunks, { type: 'video/webm' }), 'video.webm');
                    if (activeReplyData) { formData.append('replyTo', JSON.stringify(activeReplyData)); cancelReply(); }
                    fetch('/api/send', { method: 'POST', body: formData }).then(() => fetchMessages()); if (videoStreamRef) videoStreamRef.getTracks().forEach(t => t.stop());
                };
                videoRecorder.start(); btn.classList.add('recording'); btn.textContent = "🛑";
            }).catch(() => alert("Нет доступа!"));
        }
    }

    function uploadAnyFile(input) {
        if (!input.files || input.files.length === 0) return;
        const formData = new FormData(); formData.append('sender', currentUser); formData.append('room', currentRoomId);
        formData.append('type', 'file'); formData.append('media', input.files[0], input.files[0].name);
        if (activeReplyData) { formData.append('replyTo', JSON.stringify(activeReplyData)); cancelReply(); }
        fetch('/api/send', { method: 'POST', body: formData }).then(() => { input.value = ''; fetchMessages(); });
    }

    function sendMessage() {
        const input = document.getElementById('text-input'); const txt = input.value.trim(); if (!txt || !currentUser || !currentRoomId) return;
        const formData = new FormData(); formData.append('sender', currentUser); formData.append('room', currentRoomId);
        formData.append('text', txt); formData.append('type', 'text');
        if (activeReplyData) { formData.append('replyTo', JSON.stringify(activeReplyData)); cancelReply(); }
        fetch('/api/send', { method: 'POST', body: formData }).then(() => { input.value = ''; fetchMessages(); });
    }
    function fetchMessages() {
        if (!currentUser || !currentRoomId) return;
        fetch(`/api/messages?room=${currentRoomId}`).then(res => res.json()).then(data => {
            if (data.length === lastMessagesCount) return;
            lastMessagesCount = data.length; messagesDiv.innerHTML = '';
            if (data.length === 0) { messagesDiv.innerHTML = `<div class="chat-placeholder">История сообщений пуста.</div>`; return; }
            data.forEach(msg => {
                const row = document.createElement('div'); const isMy = msg.sender.toLowerCase() === currentUser.toLowerCase();
                row.className = `message-row ${isMy ? 'my-msg' : 'other-msg'}`;
                let contentHTML = '';
                if (msg.type === 'audio') contentHTML = `<audio class="audio-player" src="${msg.text}" controls></audio>`;
                else if (msg.type === 'video') contentHTML = `<video class="video-round" src="${msg.text}" playsinline autoplay muted loop onclick="playVideoWithSound(this)"></video>`;
                else if (msg.type === 'file') {
                    try {
                        const fileObj = JSON.parse(msg.text); const ext = fileObj.name.split('.').pop().toLowerCase();
                        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) contentHTML = `<img class="chat-image" src="${fileObj.path}" onclick="window.open(this.src)">`;
                        else contentHTML = `<a href="${fileObj.path}" target="_blank" class="chat-file-card"><span class="chat-file-icon">📄</span><div class="chat-file-info"><span class="chat-file-name">${fileObj.name}</span><span class="chat-file-action">Скачать</span></div></a>`;
                    } catch(e) { contentHTML = `<div class="msg-text">Поврежденный файл</div>`; }
                } else contentHTML = `<div class="msg-text">${msg.text}</div>`;
                
                let replyHTML = '';
                if (msg.replyTo) { replyHTML = `<div class="msg-reply-block" onclick="scrollToMessage('${msg.replyTo.id}')"><span class="msg-reply-author">${msg.replyTo.sender}</span><span class="msg-reply-text">${msg.replyTo.text}</span></div>`; }
                let forwardHTML = msg.forwardedFrom ? `<div class="msg-forwarded-label">↪ Переслано от: ${msg.forwardedFrom}</div>` : '';
                let authorHTML = (isCurrentGroup && !isMy) ? `<div class="msg-author">${msg.sender}</div>` : '';
                
                const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.id = `msg-${msg.id}`;
                bubble.innerHTML = `${replyHTML}${forwardHTML}${authorHTML}${contentHTML}<div class="msg-time">${msg.time}</div><div class="bubble-delete-x" onclick="event.stopPropagation(); deleteSpecificMessage('${msg.id}')">&times;</div>`;
                
                setupSwipe(row, msg); row.appendChild(bubble); messagesDiv.appendChild(row);
            });
            setTimeout(() => { messagesDiv.scrollTop = messagesDiv.scrollHeight; }, 50);
        }).catch(() => console.log("Сбой"));
    }

    function scrollToMessage(id) { const el = document.getElementById(`msg-${id}`); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.boxShadow = '0 0 15px #00ca9e'; setTimeout(() => el.style.boxShadow = 'none', 1500); } }
    function playVideoWithSound(v) { if (window.event) window.event.stopPropagation(); if (!v.muted) { v.muted = true; v.loop = true; v.play(); v.style.borderColor = "#00a884"; } else { v.muted = false; v.loop = false; v.currentTime = 0; v.style.borderColor = "#f43f5e"; v.play(); v.onended = function() { v.muted = true; v.loop = true; v.currentTime = 0; v.play(); v.style.borderColor = "#00a884"; }; } }
</script>
