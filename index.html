<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clone</title>
    <style>
        * { margin: 0; padding: 0; box-shadow: none; box-sizing: border-box; font-family: Segoe UI, Helvetica Neue, Helvetica, Lucida Grande, Arial, Ubuntu, Cantarell, Fira Sans, sans-serif; }
        body { background: #dadbd3; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Стили окна авторизации */
        #auth-screen { background: white; padding: 30px; border-radius: 12px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; display: block; border-top: 10px solid #00a884; }
        #auth-screen h2 { color: #41525d; margin-bottom: 20px; font-weight: 500; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e9edef; border-radius: 6px; outline: none; background: #f0f2f5; font-size: 15px; }
        .auth-btn { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .auth-btn:hover { background: #008f72; }
        #auth-error { color: #ea0038; font-size: 14px; margin-bottom: 10px; display: none; }

        /* Основной интерфейс мессенджера */
        #app-screen { display: none; width: 100%; max-width: 1000px; height: 95vh; background: #efeae2; box-shadow: 0 6px 18px rgba(0,0,0,0.1); border-radius: 3px; position: relative; flex-direction: column; }
        
        /* Шапка в стиле WhatsApp */
        .chat-header { background: #f0f2f5; height: 60px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e9edef; }
        .avatar { width: 40px; height: 40px; background: #607d8b; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 18px; margin-right: 15px; text-transform: uppercase; }
        .user-info h4 { color: #111b21; font-size: 16px; font-weight: 500; }
        .user-info p { color: #667781; font-size: 13px; }

        /* Окно сообщений с фирменным фоном */
        #messages { flex: 1; overflow-y: auto; padding: 20px 5%; display: flex; flex-direction: column; gap: 8px; background-image: url('https://githubusercontent.com'); background-color: #efeae2; background-repeat: repeat; }
        
        /* Стили пузырей сообщений */
        .message-row { display: flex; width: 100%; }
        .message-row.my-msg { justify-content: flex-end; }
        .message-row.other-msg { justify-content: flex-start; }
        
        .bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14.2px; color: #111b21; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); display: flex; flex-direction: column; word-break: break-word; }
        .my-msg .bubble { background: #d9fdd3; border-top-right-radius: 0; }
        .other-msg .bubble { background: white; border-top-left-radius: 0; }
        
        .msg-sender { font-size: 12.5px; font-weight: 600; color: #35a649; margin-bottom: 3px; text-transform: capitalize; }
        .other-msg .msg-sender { color: #2b7bc5; }
        .msg-text { line-height: 19px; margin-right: 40px; }
        
        .msg-time { font-size: 11px; color: #667781; position: absolute; bottom: 4px; right: 8px; }

        /* Нижняя панель ввода */
        .input-container { background: #f0f2f5; height: 62px; display: flex; align-items: center; padding: 5px 15px; gap: 12px; border-top: 1px solid #e9edef; }
        #text-input { flex: 1; height: 42px; background: white; border: none; border-radius: 8px; padding: 0 12px; font-size: 15px; outline: none; color: #111b21; }
        #send-btn { background: transparent; border: none; color: #00a884; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px 10px; transition: 0.1s; }
        #send-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- Окно авторизации/регистрации -->
    <div id="auth-screen">
        <h2>Вход в WhatsApp</h2>
        <div id="auth-error">Неверный пароль</div>
        <input type="text" id="auth-user" class="auth-input" placeholder="Введите имя пользователя">
        <input type="password" id="auth-pass" class="auth-input" placeholder="Введите пароль">
        <button onclick="handleAuth()" class="auth-btn">Войти / Создать аккаунт</button>
    </div>

    <!-- Основной чат -->
    <div id="app-screen">
        <div class="chat-header">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-info">
                <h4 id="user-display-name">Пользователь</h4>
                <p>Онлайн-комната</p>
            </div>
        </div>
        
        <div id="messages"></div>
        
        <div class="input-container">
            <input type="text" id="text-input" placeholder="Введите сообщение...">
            <button id="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
        </div>
    </div>

<script>
    let currentUser = localStorage.getItem('chat_username') || null;
    const messagesDiv = document.getElementById('messages');

    // Проверяем, авторизован ли пользователь локально
    if (currentUser) {
        showChat();
    }

    document.getElementById('text-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // Функция входа / регистрации
    function handleAuth() {
        const username = document.getElementById('auth-user').value.trim();
        const password = document.getElementById('auth-pass').value.trim();
        const errorDiv = document.getElementById('auth-error');

        if (!username || !password) {
            errorDiv.textContent = "Заполните все поля!";
            errorDiv.style.display = "block";
            return;
        }

        fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                currentUser = username;
                localStorage.setItem('chat_username', username);
                showChat();
            } else {
                errorDiv.textContent = data.message;
                errorDiv.style.display = "block";
            }
        })
        .catch(() => {
            errorDiv.textContent = "Ошибка сервера авторизации";
            errorDiv.style.display = "block";
        });
    }

    function showChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        document.getElementById('user-display-name').textContent = currentUser;
        document.getElementById('user-avatar').textContent = currentUser.substring(0,2);
        fetchMessages();
        setInterval(fetchMessages, 1500); // Начинаем автоматический опрос обновлений
    }

    // Отправка сообщения
    function sendMessage() {
        const textInput = document.getElementById('text-input');
        const text = textInput.value.trim();
        if (text === '' || !currentUser) return;

        fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, text: text })
        })
        .then(() => {
            textInput.value = '';
            fetchMessages();
        })
        .catch(err => console.error(err));
    }

    // Загрузка сообщений
    function fetchMessages() {
        fetch('/api/messages')
            .then(res => res.json())
            .then(data => {
                messagesDiv.innerHTML = '';
                data.forEach(msg => {
                    const row = document.createElement('div');
                    const isMy = msg.sender === currentUser;
                    row.className = `message-row ${isMy ? 'my-msg' : 'other-msg'}`;
                    
                    row.innerHTML = `
                        <div class="bubble">
                            ${!isMy ? `<div class="msg-sender">${msg.sender}</div>` : ''}
                            <div class="msg-text">${msg.text}</div>
                            <div class="msg-time">${msg.time}</div>
                        </div>
                    `;
                    messagesDiv.appendChild(row);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            })
            .catch(err => console.log("Сбой обновления"));
    }
</script>
</body>
</html>
