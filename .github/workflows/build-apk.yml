name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-24.04 # Оставляем стабильную убунту

    steps:
      - uses: actions/checkout@v4

      # ИСПРАВЛЕНИЕ 1: Версия v5, как просил лог
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ИСПРАВЛЕНИЕ 2: Node.js (предупреждение может остаться, это норма для 2026, но работать будет)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Установка SDK (чтобы не качал сам)
      - name: Install Android Build Tools
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          yes | sdkmanager --licenses || echo "Licenses accepted"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # 1. Создаем ключ с паролем 123456
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # 2. ГЛАВНОЕ ИСПРАВЛЕНИЕ: ПЕРЕДАЕМ ПАРОЛИ ПРЯМО В JSON
          # Без полей keyPassword и storePassword он зависает (Exit 130)
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "msb55115.ucoz.club",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://githubusercontent.com",
            "maskableIconUrl": "https://githubusercontent.com",
            "splashScreenUrl": "https://githubusercontent.com",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android",
              "keyPassword": "123456",
              "storePassword": "123456"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          cd twa-project
          # Флаг --skipPwaValidation пропускает проверку сайта (чтобы не падал, если сайт недоступен)
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
