name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    # 1. ФИКС: Используем стабильную Ubuntu 24.04, чтобы избежать проблем с миграцией на 26.04
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4

      # 2. ФИКС: Используем setup-java@v5, чтобы убрать предупреждение о депрекации
      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. ФИКС: Используем Node.js 22 (LTS), который лучше работает в новом окружении
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 4. ВАЖНО: Установка Android SDK Tools и лицензий
      # Мы явно устанавливаем build-tools "34.0.0", чтобы Bubblewrap их нашел
      - name: Install Android Build Tools
        run: |
          # Ищем sdkmanager в стандартных путях
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          
          # Принимаем лицензии
          yes | sdkmanager --licenses || echo "Licenses already accepted"
          
          # Устанавливаем конкретные версии платформ, чтобы Bubblewrap не качал их сам и не падал
          # Используем sdkmanager с флагом --install
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Указываем пути. $ANDROID_HOME в ubuntu-24.04 уже настроен корректно.
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключ подписи
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Создаем манифест
          # ИСПРАВЛЕНЫ ОШИБКИ В URL (убраны лишние ://)
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "msb55115.ucoz.club",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://onrender.com",
            "maskableIconUrl": "https://onrender.com",
            "splashScreenUrl": "https://onrender.com",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          cd twa-project
          # Запускаем сборку
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
