name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Global Gradle Network Fix
        run: |
          # 1. Отключаем анимацию загрузки, чтобы лог не зависал на 72%
          mkdir -p ~/.gradle
          echo "org.gradle.console=plain" > ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          
          # 2. Создаем глобальный скрипт инициализации, который заставит ВСЕ сборки использовать зеркала
          # Это решит проблему с зависанием "Fetch remote repository"
          echo "allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url 'https://gradle.org' }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://gradle.org' }
              }
          }" > ~/.gradle/init.gradle

      - name: Fix Android SDK Structure
        run: |
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            LATEST_VER=$(ls -d * | sort -V | tail -n1)
            ln -s "$LATEST_VER" latest
          fi

      - name: Accept Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "://onrender.com",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://://onrender.com/uploads/icon-512.png",
            "maskableIconUrl": "https://://onrender.com/uploads/icon-512.png",
            "splashScreenUrl": "https://://onrender.com/uploads/icon-512.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK (Verbose Mode)
        run: |
          cd twa-project
          # Запускаем сборку. Благодаря настройкам выше, мы увидим реальный текст вместо полоски.
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
