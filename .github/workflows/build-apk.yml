name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Настраиваем Java 17 (нужна для новых Android build tools)
      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Настраиваем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Устанавливаем Bubblewrap CLI
      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 4. Принимаем лицензии Android SDK (используем встроенный в Github SDK)
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses

      # 5. Конфигурируем Bubblewrap, указывая на системные пути Github Runner'а
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Используем переменные среды, которые уже есть в ubuntu-latest
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      # 6. Инициализируем проект (ИСПРАВЛЕНЫ URL и HOST)
      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключ
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Создаем манифест. ОБРАТИТЕ ВНИМАНИЕ: исправлены host и iconUrl
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "msb55115.ucoz.club",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://onrender.com",
            "maskableIconUrl": "https://onrender.com",
            "splashScreenUrl": "https://onrender.com",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      # 7. Сборка
      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      # 8. Загрузка результата
      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
