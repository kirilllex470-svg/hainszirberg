name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Используем актуальную версию setup-java (v5) для 2026 года
      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Обновляем Node.js действия до v5 (или актуальной)
      - name: Setup Node.js
        uses: actions/setup-node@v4  # Если v5 недоступна, v4 будет работать с предупреждением, но надежно
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 3. КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Надежный поиск и принятие лицензий
      # Вместо ручного поиска пути мы используем встроенный sdkmanager из PATH
      - name: Accept Android Licenses
        run: |
          # Пытаемся найти sdkmanager в стандартных путях, если его нет в PATH
          if ! command -v sdkmanager &> /dev/null; then
              export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          fi
          
          # Принимаем все лицензии
          yes | sdkmanager --licenses || echo "Licenses accepted or warning ignored"

      # 4. Настройка Bubblewrap с явными путями
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Генерируем конфиг, используя путь Java из шага setup-java
          # ANDROID_HOME всегда установлен на ubuntu-latest
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключ (Keystore)
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Генерируем манифест
          # ВАЖНО: Исправлен host (без https://) и iconUrl (без лишних двоеточий)
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "msb55115.ucoz.club",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://onrender.com",
            "maskableIconUrl": "https://onrender.com",
            "splashScreenUrl": "https://onrender.com",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
