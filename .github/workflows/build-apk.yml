name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install Fresh Android SDK (Guaranteed Fix)
        run: |
          # 1. Скачиваем чистые инструменты Android SDK от Google
          wget https://google.com -O sdk-tools.zip
          
          # 2. Создаем правильную структуру папок для Bubblewrap
          mkdir -p android-sdk/cmdline-tools
          unzip -q sdk-tools.zip -d android-sdk/cmdline-tools
          
          # 3. Переименовываем папку в 'latest' (Bubblewrap требует именно этого)
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          
          # 4. Принимаем лицензии
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Указываем путь к нашему ЛИЧНОМУ SDK, который мы только что скачали
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$GITHUB_WORKSPACE/android-sdk\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключ подписи
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Создаем манифест приложения
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "://onrender.com",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://://onrender.com/uploads/icon-512.png",
            "maskableIconUrl": "https://://onrender.com/uploads/icon-512.png",
            "splashScreenUrl": "https://://onrender.com/uploads/icon-512.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          cd twa-project
          # Запускаем сборку
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
