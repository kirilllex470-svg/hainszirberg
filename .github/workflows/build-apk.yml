name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Fix Android SDK Structure for Bubblewrap
        run: |
          # Исправляем ошибку "androidSdk isn't correct"
          # Bubblewrap ищет папку 'latest', а на GitHub лежат версии. Создаем ссылку вручную.
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            LATEST_VER=$(ls -d * | sort -V | tail -n1)
            ln -s "$LATEST_VER" latest
          fi

      - name: Accept Android Licenses
        run: |
          # Автоматически принимаем все лицензии Google, чтобы сборка не зависла
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Прописываем пути жестко, используя системные переменные GitHub
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключи подписи
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Создаем манифест
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "://onrender.com",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://://onrender.com/uploads/icon-512.png",
            "maskableIconUrl": "https://://onrender.com/uploads/icon-512.png",
            "splashScreenUrl": "https://://onrender.com/uploads/icon-512.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          cd twa-project
          # Запускаем сборку (теперь она не упадет, так как пути исправлены)
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
