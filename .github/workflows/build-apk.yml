name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Ставим Java 17 (стандарт)
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Ставим Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Устанавливаем Android Tools и лицензии
      - name: Install Android Build Tools
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
          yes | sdkmanager --licenses || echo "Licenses accepted"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ФИКС 1: Железобетонная настройка конфига
      # Мы берем путь к Java и Android прямо из системы ($JAVA_HOME), чтобы Bubblewrap не смел спрашивать
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "Using JAVA_HOME: $JAVA_HOME"
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          # Выводим конфиг в лог, чтобы убедиться, что он создался
          cat ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Генерируем манифест с ПАРОЛЯМИ (чтобы не спрашивал при сборке)
          # Я оставил рабочую иконку Google для теста. Если есть своя прямая ссылка — поменяй.
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "msb55115.ucoz.club",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://githubusercontent.com",
            "maskableIconUrl": "https://githubusercontent.com",
            "splashScreenUrl": "https://githubusercontent.com",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android",
              "keyPassword": "123456",
              "storePassword": "123456"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      # ФИКС 2: Принудительный ввод (printf)
      # Если он спросит "Скачать Java? (Y/n)", мы автоматически вводим "n", а затем путь к Java.
      # Это заткнет интерактивный режим.
      - name: Build APK
        run: |
          cd twa-project
          printf "n\n$JAVA_HOME\n" | bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
