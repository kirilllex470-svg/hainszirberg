name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap Paths (Dynamic)
        run: |
          mkdir -p ~/.bubblewrap
          # ВАЖНО: Используем системную переменную $ANDROID_SDK_ROOT вместо жесткого пути
          # Это гарантирует, что Bubblewrap найдет правильный SDK, где бы он ни лежал
          echo "{\"jdkPath\": \"${{ steps.setup-java.outputs.path }}\", \"androidSdkPath\": \"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Генерируем ключи подписи
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Создаем манифест
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "://onrender.com",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://://onrender.com/uploads/icon-512.png",
            "maskableIconUrl": "https://://onrender.com/uploads/icon-512.png",
            "splashScreenUrl": "https://://onrender.com/uploads/icon-512.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build TWA APK (Auto-Accept Licenses)
        run: |
          cd twa-project
          # Добавляем команду "yes", чтобы автоматически принять любые лицензионные соглашения SDK
          yes | bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk
