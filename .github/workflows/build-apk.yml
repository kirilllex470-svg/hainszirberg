name: Build Chrome-TWA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA Project
        run: |
          mkdir twa-project
          cd twa-project
          
          # Generate signing certificate keys instantly on the fly
          keytool -genkeypair -dname "cn=Darknet, ou=Zone, o=DarknetZone, c=US" -alias android -keypass 123456 -keystore android.keystore -storepass 123456 -keyalg RSA -keysize 2048 -validity 10000
          
          # Inject your exact platform parameters manifest configuration
          echo '{
            "packageId": "com.darknet.zone.twa",
            "host": "://onrender.com",
            "name": "DarknetZone",
            "launcherName": "Darknet",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://://onrender.com/uploads/icon-512.png",
            "maskableIconUrl": "https://://onrender.com/uploads/icon-512.png",
            "splashScreenUrl": "https://://onrender.com/uploads/icon-512.png",
            "display": "standalone",
            "orientation": "portrait",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK (Bypassing Prompts Automatically)
        run: |
          cd twa-project
          # CRITICAL FIX: --yes forces Bubblewrap to accept tools setup without freezing
          bubblewrap build --yes --skipPwaValidation --manifest twa-manifest.json

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Chrome-APK
          path: twa-project/app-release-signed.apk

