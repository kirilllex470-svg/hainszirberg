name: Build Native Fullscreen APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Modern Java 21 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup NodeJS Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force Create Minimal Web Project Configurations
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"darknetapp","version":"1.0.0","dependencies":{}}' > package.json
          fi
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html

      - name: Install Pure Capacitor Infrastructure
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Hardcode Fully Configured App Parameters
        run: |
          echo '{
            "appId": "com.darknet.zone",
            "appName": "DarknetZone",
            "webDir": "www",
            "server": {
              "url": "https://hainszirberg.onrender.com/",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }' > capacitor.config.json

      - name: Build and Sync Android Native Layout Folder
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject Strict Iron-Clad Hardware Permissions
        run: |
          # Добавляем POST_NOTIFICATIONS, VIBRATE и WAKE_LOCK для гарантии работы уведомлений
          PERMISSIONS='<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          sed -i "s|<application|$PERMISSIONS\n    <application|g" android/app/src/main/AndroidManifest.xml

      - name: Inject Mirror Repositories and Kotlin Module Substitutions
        run: |
          MIRRORS="buildscript { repositories { google(); mavenCentral(); maven { url 'https://gradle.org' } } }\nallprojects { repositories { google(); mavenCentral(); maven { url 'https://gradle.org' } } }"
          echo -e "$MIRRORS\n$(cat android/build.gradle)" > android/build.gradle
          
          MODULE_FIX="subprojects {
              dependencies {
                  modules {
                      module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') { replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use newer kotlin-stdlib instead') }
                      module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') { replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use newer kotlin-stdlib instead') }
                  }
              }
          }"
          echo -e "$MODULE_FIX" >> android/build.gradle

      - name: Run Auto-Compile Gradle Script
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished Deployment APK
        uses: actions/upload-artifact@v4
        with:
          name: DarknetZone-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
